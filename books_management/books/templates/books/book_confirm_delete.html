{% extends 'core/base.html' %}

{% block title %}Eliminar Libro - Mi Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card border-0 shadow-sm rounded-4 text-center p-4">
      <div class="card-body">
        <div class="text-danger mb-3">
          <i class="fa-solid fa-triangle-exclamation fs-1"></i>
        </div>
        
        <h3 class="fw-bold text-dark mb-2">¿Eliminar libro?</h3>
        <p class="text-muted mb-4">
          ¿Estás seguro de que deseas eliminar <strong>"{{ book.title }}"</strong>? Esta acción no se puede deshacer.
        </p>

        <!-- Formulario POST obligatorio para ejecutar el borrado -->
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'books:book_detail' book.id %}" class="btn btn-outline-secondary px-4 rounded-3 fw-medium">
              Cancelar
            </a>
            <button type="submit" class="btn btn-danger px-4 rounded-3 fw-semibold shadow-sm">
              <i class="fa-solid fa-trash-can me-1"></i> Confirmar Eliminación
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
